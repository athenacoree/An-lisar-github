name: PR-Guard Analysis

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request Number'
        required: true
        type: string
      commit_sha:
        description: 'PR Commit SHA'
        required: true
        type: string
      callback_url:
        description: 'PR-Guard Backend Callback API Endpoint'
        required: true
        type: string
      installation_id:
        description: 'GitHub App Installation ID'
        required: false
        type: string

jobs:
  pr-guard-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & compile PR-Guard
        run: |
          if [ -f "package.json" ]; then
            npm ci || npm install
            npm run build
          fi

      - name: Fetch PR Diff
        id: pr_diff
        run: |
          PR_NUM="${{ inputs.pr_number }}"
          echo "Fetching diff for PR #${PR_NUM}..."

          # Fetch PR diff using GitHub API with GITHUB_TOKEN header
          DIFF_CONTENT=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3.diff" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUM}")

          # Save diff to a file
          echo "$DIFF_CONTENT" > pr_diff.txt
          echo "Diff fetched successfully. Lines: $(wc -l < pr_diff.txt)"

      - name: Run Deterministic PR-Guard Analysis
        id: run_guard
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            async function main() {
              const diffText = fs.readFileSync("pr_diff.txt", "utf8");
              let runAnalysis;

              if (fs.existsSync("./dist/checker/index.js")) {
                runAnalysis = require("./dist/checker").runAnalysis;
              } else {
                console.error("Compiled checker not found in dist/checker");
                process.exit(1);
              }

              const results = await runAnalysis(diffText, process.cwd());
              fs.writeFileSync("results.json", JSON.stringify({ results }, null, 2));
              console.log("Analysis complete. Summary:", results.summary);
            }

            main().catch(err => {
              console.error("Analysis failed:", err);
              process.exit(1);
            });
          '

      - name: Send Results Back to PR-Guard Backend
        run: |
          REPO_FULL="${{ github.repository }}"
          OWNER=$(echo "$REPO_FULL" | cut -d'/' -f1)
          REPO=$(echo "$REPO_FULL" | cut -d'/' -f2)

          CALLBACK_URL="${{ inputs.callback_url }}"
          PR_NUM="${{ inputs.pr_number }}"
          INST_ID="${{ inputs.installation_id }}"
          COMMIT_SHA="${{ inputs.commit_sha }}"

          # Merge payload details
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync("results.json", "utf8"));
            data.owner = process.argv[1];
            data.repo = process.argv[2];
            data.prNumber = parseInt(process.argv[3], 10);
            data.installationId = process.argv[4] ? parseInt(process.argv[4], 10) : undefined;
            data.commitSha = process.argv[5];
            fs.writeFileSync("payload.json", JSON.stringify(data));
          ' "$OWNER" "$REPO" "$PR_NUM" "$INST_ID" "$COMMIT_SHA"

          echo "Posting results to ${CALLBACK_URL}..."
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @payload.json "$CALLBACK_URL"
